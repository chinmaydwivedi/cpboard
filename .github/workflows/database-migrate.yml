name: Production database migration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpboard-production-database-migration
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply committed migrations
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    env:
      CI: "true"
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/cpboard?sslmode=disable
      AUTH_SECRET: cpboard-ci-only-secret-not-valid-outside-github-actions
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies without production credentials
        run: npm ci

      - name: Apply migrations with the isolated owner credential
        env:
          DIRECT_URL: ${{ secrets.CPBOARD_MIGRATION_DATABASE_URL }}
        run: |
          test -n "$DIRECT_URL"
          ./node_modules/.bin/prisma migrate deploy
          ./node_modules/.bin/prisma migrate status
