<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Topic Radar</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      body {
        margin: 0;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background: radial-gradient(circle at top, #0a1630 0%, #03070f 55%, #010204 100%);
        color: #fff;
      }
      .wrap {
        max-width: 960px;
        margin: 28px auto;
        padding: 18px;
        border: 1px solid #21334f;
        border-radius: 12px;
        background: #020816;
      }
      h2 {
        margin: 0 0 4px;
        font-size: 18px;
      }
      p {
        margin: 0 0 12px;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.7);
      }
      #topicRadar {
        height: 520px !important;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h2>Codeforces + LeetCode Topic Radar</h2>
      <p>Scale markers: 5, 10, 20, 30, 100, 200, 300</p>
      <canvas id="topicRadar"></canvas>
    </div>

    <script>
      // Replace this with output from scripts/topic_radar_fetch.py -> top_topics
      const topicFrequencies = [
        { topic: "Dynamic Programming", count: 126 },
        { topic: "Graph", count: 74 },
        { topic: "Binary Search", count: 58 },
        { topic: "Math", count: 51 },
        { topic: "Greedy", count: 47 },
        { topic: "DFS", count: 42 },
        { topic: "Two Pointers", count: 35 },
        { topic: "String", count: 31 },
      ];

      const scaleMarkers = [5, 10, 20, 30, 100, 200, 300];
      const toScalePosition = (count) => {
        const c = Math.max(0, Number(count) || 0);
        if (c <= 0) return 0;
        if (c <= scaleMarkers[0]) return c / scaleMarkers[0];
        for (let i = 0; i < scaleMarkers.length - 1; i++) {
          const lo = scaleMarkers[i];
          const hi = scaleMarkers[i + 1];
          if (c <= hi) {
            const t = (Math.log10(c) - Math.log10(lo)) / (Math.log10(hi) - Math.log10(lo));
            return i + 1 + t;
          }
        }
        return scaleMarkers.length;
      };
      const values = topicFrequencies.map((x) => toScalePosition(x.count));

      new Chart(document.getElementById("topicRadar"), {
        type: "radar",
        data: {
          labels: topicFrequencies.map((x) => x.topic),
          datasets: [
            {
              label: "Solved Topic Frequency",
              data: values,
              backgroundColor: "rgba(251, 113, 133, 0.24)",
              borderColor: "rgba(251, 113, 133, 0.95)",
              borderWidth: 2,
              pointBackgroundColor: "rgba(254, 205, 211, 0.95)",
              pointBorderColor: "rgba(251, 113, 133, 0.95)",
              pointRadius: 2.5,
            },
          ],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: (ctx) => `${topicFrequencies[ctx.dataIndex].topic}: ${topicFrequencies[ctx.dataIndex].count}`,
              },
            },
          },
          scales: {
            r: {
              min: 0,
              max: scaleMarkers.length,
              ticks: {
                stepSize: 1,
                color: "rgba(255,255,255,0.95)",
                backdropColor: "transparent",
                callback: (v) => {
                  const idx = Number(v);
                  return Number.isInteger(idx) && idx >= 1 && idx <= scaleMarkers.length
                    ? `${scaleMarkers[idx - 1]}`
                    : "";
                },
              },
              grid: { color: "rgba(255,255,255,0.3)" },
              angleLines: { color: "rgba(255,255,255,0.45)" },
              pointLabels: { color: "rgba(255,255,255,0.95)" },
            },
          },
        },
      });
    </script>
  </body>
</html>
